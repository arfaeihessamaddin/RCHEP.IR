name: Daily Email Seminar Sync

# ─────────────── دستور همیشگی (Standing instruction) ───────────────
# در هر اجرا (ساعت ۱۱:۰۰ و ۲۳:۰۰ به وقت تهران) اگر از برگزارکنندگان سمینار
# (نشانی‌های فهرست APPROVED_SENDERS در scripts/email_fetcher.py) ایمیل اعلام
# سمینار رسیده باشد، این گام‌ها به‌ترتیب انجام می‌شود:
#   ۱. نشانی گیرندگان آن ایمیل (To/Cc) بدون تکرار و با وضعیت «تأییدشده» به
#      فهرست مشترکان تارنما (data/subscribers.json) افزوده می‌شود.
#   ۲. مشخصات و پوستر سمینار در تارنمای مرکز به‌روز می‌شود.
#   ۳. اطلاعیه هر سمینار در یک ایمیل جداگانه از نشانی rchep@physics.sharif.ir
#      برای همه مخاطبین تأییدشده فرستاده می‌شود؛ نشانه یکتای هر سمینار
#      (تاریخ + عنوان) در data/sent_seminars.json ثبت می‌شود تا ارسال تکراری
#      رخ ندهد و دو سمینار هم‌روز هم هر کدام ایمیل مستقل بگیرند. نشانی‌های
#      تکراری/هم‌هویت پیش از ارسال یکی می‌شوند و هیچ نامه‌ای دو بار نمی‌رود.
# این رویه در README.md (بخش ۲) نیز مستند شده است.
#
# ─────────────── گاردریل‌های ارسال (سیاست) ───────────────
# هیچ نامه‌ای به هیچ کس دوبار نمی‌رود. قواعد در docs/EMAIL_GUARDRAILS.md و کد در
# scripts/send_guard.py؛ خلاصه:
#   ۱. ادعای پیش از ارسال: نشانه «فرستاده‌شده» پیش از تماس با SMTP ذخیره می‌شود
#      (data/send_log.jsonl و sent_at در صف)؛ در شکست ارسال ادعا آزاد می‌شود.
#   ۲. یک پیام/یک شخص: کلید (نشانی + گونه پیام + نشانه رویداد) در بازه خنک‌شدن
#      ۲۴ ساعته فقط یک‌بار پذیرفته می‌شود.
#   ۳. یک رونوشت برای هر شخص: نشانی‌های هم‌هویت (نقطه‌های جیمیل، +tag،
#      googlemail) پیش از ارسال یکی می‌شوند.
#   ۴. تک‌اجرایی: دو اجرای همزمان این workflow رخ نمی‌دهد (concurrency پایین).
#   ۵. سقف ارسال در هر اجرا (پیش‌فرض ۵۰۰) به‌عنوان محافظ حلقه ناخواسته.
#   ۶. آزمون خشک (RCHEP_DRY_RUN=1) هیچ چیزی را «فرستاده‌شده» علامت نمی‌زند.
# بازفرست عمدی فقط با ورودی resend_dates (اطلاعیه سمینار) یا force_send=1.
# پیش از گام ارسال، آزمون scripts/send_guard_selftest.py اجرا می‌شود؛ اگر
# گاردریل‌ها خراب باشند، اجرا پیش از هر ارسالی متوقف می‌شود.
# ────────────────────────────────────────────────────────
# ────────────────────────────────────────────────────────────────────

on:
  schedule:
    # Tehran time (UTC+3:30): 11:00 and 23:00
    # GitHub Actions cron uses UTC: 07:30 and 19:30
    - cron: '30 7,19 * * *'
  workflow_dispatch:
    inputs:
      resend_dates:
        description: 'تاریخهایی که اطلاعیهشان باید دوباره فرستاده شود (مثال: 1405_آبان_25 یا با کاما جدا)'
        required: false
        default: ''
      probe_inbox:
        description: 'پویش خواندنی صندوق پستی برای یافتن اطلاعیه/پوستر (1 = روشن)'
        required: false
        default: ''
      force_send:
        description: 'بازفرست عمدی همانروز (گاردریل تکرار را کنار میگذارد؛ 1 = روشن)'
        required: false
        default: ''
      welcome_once:
        description: 'ارسال یکبارهٔ ایمیل خوشآمد (1 = روشن؛ فقط به نشانی welcome_to)'
        required: false
        default: ''
      welcome_to:
        description: 'نشانی مقصد اجرای یکبارهٔ ایمیل خوشآمد'
        required: false
        default: 'arfaeihessamaddin@gmail.com'

permissions:
  contents: write

# ─────────────── یکتایی اجرا (single-flight) ───────────────
# تا زمانی که یک اجرا در جریان است اجرای دیگری آغاز نمی‌شود؛ در نتیجه نشانهٔ
# «فرستاده‌شده»ی هر اطلاعیه پیش از اجرای بعدی روی شاخه دیده می‌شود و هیچ
# اطلاعیه‌ای دو بار برای مخاطبان نمی‌رود.
concurrency:
  group: email-sync
  cancel-in-progress: false

jobs:
  sync-emails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # آزمون‌های گاردریل پیش از هر ارسال، بدون هیچ تماس شبکه‌ای. اگر گاردریل‌ها
      # خراب باشند اجرا همین‌جا می‌ایستد و هیچ نامه‌ای نمی‌رود.
      #   ۱. آزمون واحد ماژول گاردریل (یکسان‌سازی هویت، ادعا/آزادسازی، سقف، حریم خصوصی)
      #   ۲. آزمون سرتاسری روی کد واقعی: یک ایمیل خوش‌آمد در هفت پیمایش پیاپی،
      #      بازفرست اطلاعیه مسدود، شکست SMTP جبران، یک‌رونوشت‌سازی پیش از ارسال
      - name: Guardrail tests (no network, fail before any send)
        run: |
          python3 scripts/send_guard_selftest.py
          python3 scripts/send_guard_e2e_test.py
          python3 scripts/poster_guard_selftest.py
          python3 scripts/poster_preview_selftest.py
          python3 scripts/load_order_selftest.py

      - name: Run Email Fetcher and Newsletter Processor
        if: ${{ inputs.welcome_once != '1' }}
        env:
          RCHEP_FORCE_SEND: ${{ inputs.force_send }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SHARIF_MAIL_HOST: ${{ secrets.SHARIF_MAIL_HOST }}
          SHARIF_MAIL_PORT: ${{ secrets.SHARIF_MAIL_PORT }}
          SHARIF_MAIL_USER: ${{ secrets.SHARIF_MAIL_USER }}
          SHARIF_MAIL_PASSWORD: ${{ secrets.SHARIF_MAIL_PASSWORD }}
          SHARIF_WEBDAV_URL: ${{ secrets.SHARIF_WEBDAV_URL }}
          SHARIF_WEBDAV_USER: ${{ secrets.SHARIF_WEBDAV_USER }}
          SHARIF_WEBDAV_PASSWORD: ${{ secrets.SHARIF_WEBDAV_PASSWORD }}
          RCHEP_RESEND_DATES: ${{ inputs.resend_dates }}
        run: |
          chmod +x scripts/email_fetcher.py scripts/newsletter_manager.py scripts/sync_sharif_cloud.py
          python scripts/newsletter_manager.py process
          python scripts/email_fetcher.py
          python scripts/newsletter_manager.py send-notices
          python scripts/sync_sharif_cloud.py

      # اجرای یکبارهٔ ایمیل خوشآمد — تنها با فرمان دستی (welcome_once=1)، فقط به
      # نشانیهای welcome_to و با حاکمیت WELCOME_NEVER؛ در این اجرا هیچ اطلاعیهٔ
      # سمیناری فرستاده نمیشود (گام پردازش اصلی در همین حالت کنار گذاشته میشود).
      - name: One-time welcome email (manual, single target)
        if: ${{ inputs.welcome_once == '1' }}
        env:
          RCHEP_WELCOME_TO: ${{ inputs.welcome_to }}
          SHARIF_MAIL_HOST: ${{ secrets.SHARIF_MAIL_HOST }}
          SHARIF_MAIL_PORT: ${{ secrets.SHARIF_MAIL_PORT }}
          SHARIF_MAIL_USER: ${{ secrets.SHARIF_MAIL_USER }}
          SHARIF_MAIL_PASSWORD: ${{ secrets.SHARIF_MAIL_PASSWORD }}
        run: python scripts/newsletter_manager.py welcome-once

      # پویش خواندنی (بدون هیچ ارسال یا تغییر در صندوق پستی): فقط برای یافتن
      # اطلاعیه و پوستر یک برنامه، مثلاً نشست هوشواره از ایمیل استاد سیری.
      - name: Probe inboxes for announcements and posters (read-only)
        if: ${{ inputs.probe_inbox == '1' }}
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SHARIF_MAIL_HOST: ${{ secrets.SHARIF_MAIL_HOST }}
          SHARIF_MAIL_PORT: ${{ secrets.SHARIF_MAIL_PORT }}
          SHARIF_MAIL_USER: ${{ secrets.SHARIF_MAIL_USER }}
          SHARIF_MAIL_PASSWORD: ${{ secrets.SHARIF_MAIL_PASSWORD }}
        run: python scripts/mail_probe.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Auto-update seminar details from email announcement [skip ci]"
            git push origin main
          else
            echo "No new updates from emails."
          fi
