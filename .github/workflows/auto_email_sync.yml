name: Daily Email Seminar Sync

on:
  schedule:
    # Tehran time (UTC+3:30): 11:00 and 23:00
    # GitHub Actions cron uses UTC: 07:30 and 19:30
    - cron: '30 7,19 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-emails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Email Fetcher
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          chmod +x scripts/email_fetcher.py
          python scripts/email_fetcher.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Auto-update seminar details from email announcement [skip ci]"
            git push origin main
          else
            echo "No new updates from emails."
          fi
