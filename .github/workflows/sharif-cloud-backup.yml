name: Backup RCHEP website to Sharif Cloud

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sharif-cloud-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate WebDAV credentials
        env:
          SHARIF_WEBDAV_URL: ${{ secrets.SHARIF_WEBDAV_URL }}
          SHARIF_WEBDAV_USER: ${{ secrets.SHARIF_WEBDAV_USER }}
          SHARIF_WEBDAV_PASSWORD: ${{ secrets.SHARIF_WEBDAV_PASSWORD }}
        run: |
          test -n "$SHARIF_WEBDAV_URL" || { echo "Missing SHARIF_WEBDAV_URL"; exit 1; }
          test -n "$SHARIF_WEBDAV_USER" || { echo "Missing SHARIF_WEBDAV_USER"; exit 1; }
          test -n "$SHARIF_WEBDAV_PASSWORD" || { echo "Missing SHARIF_WEBDAV_PASSWORD"; exit 1; }

      - name: Package website and upload to Sharif Cloud
        env:
          SHARIF_WEBDAV_URL: ${{ secrets.SHARIF_WEBDAV_URL }}
          SHARIF_WEBDAV_USER: ${{ secrets.SHARIF_WEBDAV_USER }}
          SHARIF_WEBDAV_PASSWORD: ${{ secrets.SHARIF_WEBDAV_PASSWORD }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          # Normalize accidental whitespace or enclosing quotes/brackets in the URL secret.
          BASE="$(printf '%s' "$SHARIF_WEBDAV_URL" | tr -d '\r\n' | sed -e 's/^[[:space:]<"]*//' -e 's/[[:space:]>"]*$//')"
          BASE="${BASE%/}"
          if [[ ! "$BASE" =~ ^https?://[^/]+(/.*)?$ ]]; then
            echo "SHARIF_WEBDAV_URL is not a valid absolute HTTP(S) URL. Check the secret value."
            exit 1
          fi
          echo "WebDAV endpoint host: ${BASE#*://}" | cut -d/ -f1
          ROOT="${BASE}/rchep-website"

          # پرچمهای پایداری: شبکهٔ ابر شریف گاهی پیوند TLS را گذرا ریست میکند
          # (curl exit 35/52/56). بیاین پرچمها یک ریست گذرا تمام پشتیبانگیری را
          # شکست میداد. --retry-all-errors دربرگیرندهٔ خطاهای TLS هم میشود.
          CURL_RETRY=(--retry 5 --retry-all-errors --retry-delay 3 --retry-connrefused --connect-timeout 25 --max-time 300)

          mkdir_remote() {
            local url="$1"
            local code
            code=$(curl "${CURL_RETRY[@]}" --silent --show-error --output /dev/null --write-out "%{http_code}" \
              --user "$SHARIF_WEBDAV_USER:$SHARIF_WEBDAV_PASSWORD" \
              --request MKCOL "$url") || { echo "MKCOL failed (curl exit $?) : $url"; exit 1; }
            case "$code" in
              201|405) ;;
              *) echo "Could not create/check WebDAV folder (HTTP $code): $url"; exit 1 ;;
            esac
          }

          upload_file() {
            local local_file="$1"
            local remote_url="$2"
            local attempt rc=1 code
            for attempt in 1 2 3; do
              set +e
              curl "${CURL_RETRY[@]}" --fail --silent --show-error \
                --user "$SHARIF_WEBDAV_USER:$SHARIF_WEBDAV_PASSWORD" \
                --upload-file "$local_file" "$remote_url"
              rc=$?
              set -e
              [ "$rc" -eq 0 ] && break
              echo "Upload attempt $attempt failed (curl exit $rc): $remote_url"
              sleep $((attempt * 4))
            done
            if [ "$rc" -ne 0 ]; then
              echo "Giving up after 3 attempts (last curl exit $rc): $remote_url"
              exit 1
            fi
            code=$(curl "${CURL_RETRY[@]}" --silent --show-error --output /dev/null --write-out "%{http_code}" \
              --user "$SHARIF_WEBDAV_USER:$SHARIF_WEBDAV_PASSWORD" \
              --request PROPFIND --header "Depth: 0" "$remote_url") || true
            test "$code" = "207" || { echo "Upload verification failed (HTTP $code): $remote_url"; exit 1; }
          }

          for folder in website-files documentation design-decisions change-log backups full-source; do
            mkdir_remote "$ROOT/$folder"
          done

          # Ensure subscribers spreadsheet is compiled
          python3 scripts/sync_sharif_cloud.py || true

          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          SHORT_SHA="${SOURCE_SHA:0:12}"
          ARCHIVE="RCHEP-website-${STAMP}-${SHORT_SHA}.zip"
          git archive --format=zip --prefix=RCHEP-website/ "$SOURCE_SHA" -o "$RUNNER_TEMP/$ARCHIVE"

          upload_file "$RUNNER_TEMP/$ARCHIVE" "$ROOT/backups/$ARCHIVE"
          upload_file "$RUNNER_TEMP/$ARCHIVE" "$ROOT/website-files/RCHEP-website-current.zip"

          # Upload uncompressed live files directly so any successor can browse or edit without unzipping
          for f in *.html *.json CNAME; do
            if [ -f "$f" ]; then
              upload_file "$f" "$ROOT/full-source/$f"
            fi
          done

          if [ -d "scripts" ]; then
            mkdir_remote "$ROOT/full-source/scripts"
            for s in scripts/*.py; do
              if [ -f "$s" ]; then
                upload_file "$s" "$ROOT/full-source/$s"
              fi
            done
          fi

          if [ -d "data" ]; then
            mkdir_remote "$ROOT/full-source/data"
            for d in data/*.json data/*.xlsx; do
              if [ -f "$d" ]; then
                upload_file "$d" "$ROOT/full-source/$d"
              fi
            done
          fi

          # Also keep the latest subscribers spreadsheet directly in the root folder for easy access
          if [ -f "data/subscribers.xlsx" ]; then
            upload_file "data/subscribers.xlsx" "$ROOT/subscribers.xlsx"
          fi

          if [ -f "README.md" ]; then
            upload_file "README.md" "$ROOT/documentation/README.md"
          fi

          {
            echo "RCHEP website backup"
            echo "UTC time: $STAMP"
            echo "Commit: $SOURCE_SHA"
            echo "Archive: $ARCHIVE"
            git show -s --format="Commit subject: %s%nCommit date: %cI" "$SOURCE_SHA"
          } > "$RUNNER_TEMP/backup-info.txt"
          upload_file "$RUNNER_TEMP/backup-info.txt" "$ROOT/change-log/latest-backup.txt"

          echo "Sharif Cloud backup uploaded and verified: $ARCHIVE"
